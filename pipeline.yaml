apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: tax-calculator-pipeline

spec:
  tasks:

    - name: npminstall
      taskRef:
        name: npm

    - name: tests
      runAfter:
        - npminstall
      taskRef:
        name: jasmine

    - name: build
      runAfter:
        - tests
      taskRef:
        name: build
