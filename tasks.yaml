apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  steps:
    - name: npm-install
      image: node:18
      script: |
        #!/usr/bin/env sh
        npm install

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  steps:
    - name: jasmine-test
      image: node:18
      script: |
        #!/usr/bin/env sh
        npm install
        npx jasmine
